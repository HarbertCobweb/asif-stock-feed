
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Auburn Stock Feed</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0c2340;
  color:white;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:2rem;
}

.card{
  background:white;
  color:#111;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 10px 40px rgba(0,0,0,.3);
}

.header{
  background:#e87722;
  color:white;
  padding:1.5rem;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:1rem;
  border-bottom:1px solid #eee;
  text-align:right;
}

th:first-child,
td:first-child{
  text-align:left;
}

.pos{color:green;font-weight:bold;}
.neg{color:red;font-weight:bold;}

.updated{
  padding:1rem;
  font-size:.9rem;
  opacity:.7;
}

@media(max-width:700px){
  th,td{
    padding:.65rem;
    font-size:.85rem;
  }
}
</style>
</head>
<body>

<div class="container">
  <div class="card">
    <div class="header">
      <h1>Auburn Market Feed</h1>
      <p>Live AI-powered stock snapshot</p>
    </div>

    <div class="updated" id="updated"></div>

    <table>
      <thead>
        <tr>
          <th>Symbol</th>
          <th>Price</th>
          <th>Open</th>
          <th>Volume</th>
          <th>Change</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<script>
async function loadData(){

  const res = await fetch('/data/stocks.json');

  if(!res.ok){
    document.getElementById('tbody').innerHTML =
      '<tr><td colspan="5">No stock data cached yet. Visit /api/refresh first.</td></tr>';
    return;
  }

  const json = await res.json();

  document.getElementById('updated').innerText =
    'Last Updated: ' + new Date(json.updatedAt).toLocaleString();

  const tbody = document.getElementById('tbody');

  tbody.innerHTML = '';

  json.data.forEach(stock=>{

    const cls = stock.change >= 0 ? 'pos' : 'neg';

    tbody.innerHTML += `
      <tr>
        <td>${stock.symbol}</td>
        <td>$${Number(stock.price).toFixed(2)}</td>
        <td>$${Number(stock.open).toFixed(2)}</td>
        <td>${Number(stock.volume).toLocaleString()}</td>
        <td class="${cls}">
          ${stock.change >= 0 ? '+' : ''}${Number(stock.change).toFixed(2)}
          (${stock.changePct}%)
        </td>
      </tr>
    `;
  });
}

loadData();
</script>

</body>
</html>
